# Ascent actions for the turbulence_density_lines example.
#
# Pipelines:
#   pl_lines:
#     1. composite_vector: assemble B = (B1, B2, B3).
#     2. streamline: trace field lines, output as 3D tubes (`B_lines`).
#
# Scene with two co-rendered plots:
#   p_density: ray-traced volume render of the density `N` directly off the
#              published mesh (no pipeline).
#   p_lines:   pseudocolor of the streamline tubes from `pl_lines`.
#
# Both plots share the same camera/render so they composite into a single
# image per cycle.

-
  action: "add_pipelines"
  pipelines:
    pl_lines:
      f1:
        type: "composite_vector"
        params:
          field1: "B1"
          field2: "B2"
          field3: "B3"
          output_name: "B"
      f2:
        type: "streamline"
        params:
          field: "B"
          num_steps: 200
          step_size: 0.5
          enable_tubes: "true"
          tube_size: 0.35
          tube_sides: 6
          output_field: "B_lines"
          seeds:
            type: "box"
            sampling_type: "uniform"
            sampling_space: "interior"
            x_extents: [-28.0, 28.0]
            y_extents: [-28.0, 28.0]
            z_extents: [-28.0, 28.0]
            num_seeds: 48

-
  action: "add_scenes"
  scenes:
    s_combo:
      plots:
        # Background: ray-traced volume render of particle density.
        p_density:
          type: "volume"
          field: "N"
          # Make low densities transparent so the field lines show through.
          min_value: 0.5
          max_value: 4.0
        # Foreground: magnetic field lines as 3D tubes.
        p_lines:
          type: "pseudocolor"
          pipeline: "pl_lines"
          field: "B_lines"
      renders:
        r1:
          type: "raytracer"
          image_width: 1024
          image_height: 1024
          image_prefix: "density_lines_%08d"
          bg_color: [0.0, 0.0, 0.0]
          fg_color: [1.0, 1.0, 1.0]
          camera:
            position: [80.0, 80.0, 80.0]
            look_at: [0.0, 0.0, 0.0]
            up: [0.0, 0.0, 1.0]
            fov: 35.0
