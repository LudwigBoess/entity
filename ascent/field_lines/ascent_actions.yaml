# Ascent actions for the turbulence_lines example.
#
# Pipeline:
#   1. composite_vector: assemble B = (B1, B2, B3) from the three published
#      scalar component fields.
#   2. streamline: integrate field lines through B starting from a uniform
#      grid of seeds across the interior of the box. Output is rendered as
#      3D tubes (`enable_tubes = "true"`) so they can be raytraced.
# Scene:
#   3. pseudocolor plot of the streamline output, ray-traced to PNG.
#
# This file is loaded automatically by Ascent when the option
#   output.ascent.actions_file = "ascent_actions.yaml"
# is set in the toml input file.

-
  action: "add_pipelines"
  pipelines:
    pl_lines:
      f1:
        type: "composite_vector"
        params:
          field1: "B1"
          field2: "B2"
          field3: "B3"
          output_name: "B"
      f2:
        type: "streamline"
        params:
          field: "B"
          # Each line is integrated for num_steps * step_size code-units.
          num_steps: 200
          step_size: 0.5
          enable_tubes: "true"
          tube_size: 0.4
          tube_sides: 6
          output_field: "B_lines"
          seeds:
            type: "box"
            sampling_type: "uniform"
            sampling_space: "interior"
            x_extents: [-28.0, 28.0]
            y_extents: [-28.0, 28.0]
            z_extents: [-28.0, 28.0]
            num_seeds: 64

-
  action: "add_scenes"
  scenes:
    s_lines:
      plots:
        p1:
          type: "pseudocolor"
          pipeline: "pl_lines"
          field: "B_lines"
      renders:
        r1:
          type: "raytracer"
          image_width: 1024
          image_height: 1024
          image_prefix: "turbulence_lines_%08d"
          bg_color: [0.0, 0.0, 0.0]
          fg_color: [1.0, 1.0, 1.0]
          camera:
            position: [80.0, 80.0, 80.0]
            look_at: [0.0, 0.0, 0.0]
            up: [0.0, 0.0, 1.0]
            fov: 35.0
